# Workflow name
name: Lint and Build

# Define when the workflow will run
on: 
  pull_request:
    branches: ["main", "feat/*", "feature/*", "bugfix/*", "fix/*", "chore/*", "docs/*"]

permissions:
  contents: read

jobs:
  lint_and_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup node js 24.12.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.12.0

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint OXC
      run: bun run lint
    
  